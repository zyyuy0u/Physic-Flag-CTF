# IoT 蜜罐系統 - Docker Compose 服務編排
# 包含：資料庫、受害網站、防禦監控 三大服務

services:
  # 資料庫服務
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - honeypot-net

  # 受害網站服務（含 SQL 注入與指令注入漏洞）
  web-app:
    build: ./web
    container_name: web-app
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - ./web/src:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      - db
    networks:
      - honeypot-net

  # 防禦監控服務（Docker Log 分析 + eBPF Reverse Shell 偵測 + GPIO 警示）
  # privileged: true       — GPIO + BPF 載入皆需要
  # pid: host              — 才能從 /proc 解析 web-app 的 cgroup id
  # /sys/kernel/debug      — tracepoint 註冊路徑
  # /sys/fs/bpf            — BPF map / program pinning
  # /lib/modules /usr/src  — bcc runtime compile 需要 kernel headers / BTF
  defense-system:
    build: ./defense
    restart: unless-stopped
    privileged: true
    pid: host
    cgroup: host                           # 必要：讓容器看見宿主機 cgroup hierarchy
    depends_on:
      - web-app                            # 確保 web-app cgroup 在 defense 啟動前已存在
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PIGPIO_HOST: host.docker.internal
      WEB_CONTAINER: web-app
    volumes:
      - ./defense:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
    command: python3 -u /app/monitor.py
    networks:
      - honeypot-net

volumes:
  db_data:

networks:
  honeypot-net:
    driver: bridge
